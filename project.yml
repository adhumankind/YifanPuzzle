name: YifanPuzzle
options:
  bundleIdPrefix: com.yifan
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1" # 仅限 iPhone
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  YifanPuzzle:
    type: application
    platform: iOS
    sources:
      - path: YifanPuzzle
    resources:
      - path: YifanPuzzle/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yifan.puzzle
        PRODUCT_NAME: YifanPuzzle
        INFOPLIST_FILE: YifanPuzzle/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"

  YifanPuzzleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YifanPuzzleTests
    dependencies:
      - target: YifanPuzzle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yifan.puzzle.tests
        GENERATE_INFOPLIST_FILE: "YES"

  YifanPuzzleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YifanPuzzleUITests
    dependencies:
      - target: YifanPuzzle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yifan.puzzle.uitests
        GENERATE_INFOPLIST_FILE: "YES"
