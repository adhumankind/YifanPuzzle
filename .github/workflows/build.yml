name: Build & Package IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Package IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate --spec project.yml
          ls -la YifanPuzzle.xcodeproj

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project YifanPuzzle.xcodeproj \
            -scheme YifanPuzzleTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -quiet || true

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project YifanPuzzle.xcodeproj \
            -scheme YifanPuzzle \
            -configuration Release \
            -archivePath build/YifanPuzzle.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/YifanPuzzle.xcarchive/Products/Applications/YifanPuzzle.app build/Payload/
          cd build
          zip -r YifanPuzzle-unsigned.ipa Payload
          cd ..
          ls -lh build/YifanPuzzle-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YifanPuzzle-unsigned-ipa
          path: build/YifanPuzzle-unsigned.ipa
          retention-days: 14

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/YifanPuzzle-unsigned.ipa
          generate_release_notes: true
          title: "一凡拼图 发布 ${{ github.ref_name }}"
          body: |
            ### 一凡拼图 (Yifan Puzzle) iOS 越狱/自签安装包

            本 IPA 为未签名包，下载后可通过以下任意工具完成签名并安装到你的 iPhone：
            - **Sideloadly** (推荐，支持 Windows/Mac，使用免费 Apple ID 自签名)
            - **AltStore** (无线自动续签)
            - **TrollStore** (巨魔商店，永久免签，iOS 14-17.0)
            - **全能签 / 轻松签 (eSign)** (手机端直接自签)

            详见项目内的 [安装指南](README.md)。
